name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            marvis-pessoal/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build root project
        run: npm run build

      - name: Install Marvis dependencies
        working-directory: marvis-pessoal
        run: npm ci

      - name: Build Marvis
        working-directory: marvis-pessoal
        run: npm run build

      - name: Add Marvis to Pages artifact
        run: |
          mkdir -p dist/marvis-pessoal
          cp -R marvis-pessoal/dist/* dist/marvis-pessoal/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
